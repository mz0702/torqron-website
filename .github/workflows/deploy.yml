# Builds the site and publishes it to GitHub Pages under https://<owner>.github.io/<repo>/
# on every push to main (or by hand under Actions → Deploy to GitHub Pages → Run workflow).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # npm install, not npm ci: the lock file is written on macOS and lacks a few Linux-only optional packages
      - run: npm install --no-audit --no-fund
      - run: npm run build
      # the source links from the domain root; the Pages copy lives in /<repo>/ and must not be indexed
      - run: node scripts/rebase.mjs dist "/${{ github.event.repository.name }}" --noindex
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
